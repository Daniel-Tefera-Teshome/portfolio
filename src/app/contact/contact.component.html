<section id="contact" class="section-default section-container">
  <app-section-header
    eyebrow="Contact"
    title="Let's Work Together"
    subtitle="Open to new opportunities, collaborations, and meaningful projects."
  ></app-section-header>

  <div class="grid gap-10 lg:grid-cols-2">
    <div class="space-y-4" appScrollReveal>
      @for (link of contactLinks; track link.label) {
        <a
          [href]="link.href"
          [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener noreferrer' : null"
          class="card flex items-center gap-4 transition hover:border-indigo-300 dark:hover:border-indigo-700"
        >
          <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
          </span>
          <span class="font-medium text-slate-800 dark:text-slate-200">
            @if (link.label.includes('@')) {
              danieltefera14&#64;gmail.com
            } @else {
              {{ link.label }}
            }
          </span>
        </a>
      }
    </div>

    <div appScrollReveal>
      @if (submitted()) {
        <div class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:border-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
          Thank you for reaching out. Please use the email or social links for a direct response.
        </div>
      }

      <form class="card space-y-4" (submit)="onSend($event)">
        <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Send a Message</h3>
        <div>
          <label for="name" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-600 dark:bg-slate-800 dark:text-white"
            required
          />
        </div>
        <div>
          <label for="email" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-600 dark:bg-slate-800 dark:text-white"
            required
          />
        </div>
        <div>
          <label for="message" class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300">Message</label>
          <textarea
            id="message"
            name="message"
            rows="4"
            class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 dark:border-slate-600 dark:bg-slate-800 dark:text-white"
            required
          ></textarea>
        </div>
        <button type="submit" class="btn-primary w-full">Send Message</button>
      </form>
    </div>
  </div>
</section>
