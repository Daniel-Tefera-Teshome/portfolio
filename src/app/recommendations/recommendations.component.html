<section id="recommendations" class="section-alt section-container">
  <app-section-header
    eyebrow="Recommendations"
    title="What Colleagues Say"
    subtitle="Endorsements from lead engineers and developers I've worked with at Perago Information Systems."
  ></app-section-header>

  <div class="grid gap-8 lg:grid-cols-2">
    @for (rec of recommendations; track rec.name) {
      <article class="card relative flex flex-col" appScrollReveal>
        <svg class="mb-4 h-8 w-8 text-indigo-300 dark:text-indigo-700" fill="currentColor" viewBox="0 0 24 24">
          <path d="M4.583 17.321C3.553 16.227 3 15 3 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179zm10 0C13.553 16.227 13 15 13 13.011c0-3.5 2.457-6.637 6.03-8.188l.893 1.378c-3.335 1.804-3.987 4.145-4.247 5.621.537-.278 1.24-.375 1.929-.311 1.804.167 3.226 1.648 3.226 3.489a3.5 3.5 0 01-3.5 3.5c-1.073 0-2.099-.49-2.748-1.179z"/>
        </svg>

        <blockquote class="flex-1 text-sm leading-relaxed text-slate-600 dark:text-slate-300">
          "{{ rec.quote }}"
        </blockquote>

        <footer class="mt-6 flex items-center justify-between gap-4 border-t border-slate-200 pt-5 dark:border-slate-700">
          <div>
            <p class="font-semibold text-slate-900 dark:text-white">{{ rec.name }}</p>
            <p class="mt-0.5 text-xs text-indigo-600 dark:text-indigo-400">{{ rec.title }}</p>
            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">{{ rec.context }} · {{ rec.date }}</p>
          </div>
          <a
            [href]="rec.linkedin"
            target="_blank"
            rel="noopener noreferrer"
            class="shrink-0 rounded-lg border border-slate-200 p-2 text-slate-500 transition hover:border-indigo-300 hover:text-indigo-600 dark:border-slate-700 dark:hover:border-indigo-500 dark:hover:text-indigo-400"
            [attr.aria-label]="'View ' + rec.name + ' on LinkedIn'"
          >
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 0h-14C2.24 0 0 2.24 0 5v14c0 2.76 2.24 5 5 5h14c2.76 0 5-2.24 5-5V5c0-2.76-2.24-5-5-5zM7.12 19H4.54V9h2.58v10zM5.83 7.73c-.83 0-1.5-.68-1.5-1.5s.67-1.5 1.5-1.5c.83 0 1.5.68 1.5 1.5s-.67 1.5-1.5 1.5zM20 19h-2.58v-5.4c0-1.29-.03-2.94-1.79-2.94-1.79 0-2.06 1.4-2.06 2.85V19H11V9h2.48v1.36h.03c.35-.67 1.22-1.38 2.51-1.38 2.68 0 3.18 1.76 3.18 4.06V19z"/>
            </svg>
          </a>
        </footer>
      </article>
    }
  </div>
</section>
