<header
  class="fixed inset-x-0 top-0 z-50 border-b border-slate-200/80 bg-white/90 shadow-sm backdrop-blur-md transition-all duration-300 dark:border-slate-800/80 dark:bg-slate-950/90"
>
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
    <button
      type="button"
      (click)="scrollTo('about')"
      class="text-lg font-bold tracking-tight text-slate-900 dark:text-white"
    >
      Daniel<span class="text-indigo-600 dark:text-indigo-400">.</span>
    </button>

    <div class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.fragment) {
        <button
          type="button"
          (click)="scrollTo(link.fragment)"
          class="rounded-lg px-3 py-2 text-sm font-medium transition-colors"
          [ngClass]="activeSection() === link.fragment
            ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300'
            : 'text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400'"
        >
          {{ link.label }}
        </button>
      }
      <div class="ml-2 border-l border-slate-200 pl-3 dark:border-slate-700">
        <app-theme-toggle variant="nav"></app-theme-toggle>
      </div>
    </div>

    <div class="flex items-center gap-2 md:hidden">
      <app-theme-toggle variant="nav"></app-theme-toggle>
      <button
        type="button"
        (click)="toggleMenu()"
        class="rounded-lg p-2 text-slate-700 dark:text-slate-200"
        aria-label="Toggle menu"
      >
        @if (menuOpen()) {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        } @else {
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        }
      </button>
    </div>
  </nav>

  @if (menuOpen()) {
    <div class="border-t border-slate-200 bg-white px-6 py-4 dark:border-slate-800 dark:bg-slate-950 md:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.fragment) {
          <button
            type="button"
            (click)="scrollTo(link.fragment)"
            class="rounded-lg px-3 py-3 text-left text-sm font-medium transition-colors"
            [ngClass]="activeSection() === link.fragment
              ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300'
              : 'text-slate-600 dark:text-slate-300'"
          >
            {{ link.label }}
          </button>
        }
      </div>
    </div>
  }
</header>
