<section id="skills" class="section-default section-container">
  <app-section-header
    eyebrow="Skills"
    title="Technical Expertise"
    subtitle="Technologies and tools I use to build scalable, maintainable web applications."
  ></app-section-header>

  <div class="space-y-10">
    @for (group of groups; track group.title) {
      <div appScrollReveal>
        <h3 class="mb-4 text-sm font-semibold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">
          {{ group.title }}
        </h3>
        <div class="flex flex-wrap gap-3">
          @for (skill of group.skills; track skill) {
            <span class="skill-pill">{{ skill }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
