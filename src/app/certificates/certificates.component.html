<section id="certificates" class="section-default section-container">
  <app-section-header
    eyebrow="Certifications"
    title="Professional Development"
    subtitle="Continuous learning in modern frontend, DevOps, and JavaScript."
  ></app-section-header>

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (cert of certificates; track cert.title) {
      <article class="card flex flex-col" appScrollReveal>
        <div class="mb-3 flex items-start justify-between gap-2">
          <h3 class="text-lg font-semibold text-slate-900 dark:text-white">{{ cert.title }}</h3>
          <span class="tag shrink-0">{{ cert.date }}</span>
        </div>
        <p class="flex-1 text-sm text-slate-600 dark:text-slate-300">{{ cert.description }}</p>
        <a
          [href]="cert.url"
          target="_blank"
          rel="noopener noreferrer"
          class="mt-4 inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400"
        >
          View Certificate
          <svg class="ml-1 h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
          </svg>
        </a>
      </article>
    }
  </div>
</section>
