<section id="education" class="section-alt section-container">
  <app-section-header
    eyebrow="Education"
    title="Academic Background"
    subtitle="Strong foundation in computer science, networking, and security."
  ></app-section-header>

  <div class="grid gap-6 md:grid-cols-2">
    @for (item of education; track item.degree) {
      <article class="card h-full" appScrollReveal>
        <div class="mb-3 flex flex-wrap items-start justify-between gap-2">
          <h3 class="text-lg font-semibold text-slate-900 dark:text-white">{{ item.degree }}</h3>
          <span class="tag">{{ item.period }}</span>
        </div>
        <p class="font-medium text-indigo-600 dark:text-indigo-400">
          {{ item.school }} · GPA {{ item.gpa }}
        </p>
        <a [href]="item.url" target="_blank" rel="noopener noreferrer" class="mt-1 inline-block text-sm text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400">
          {{ item.url.replace('https://', '') }}
        </a>
        <p class="mt-4 text-sm text-slate-600 dark:text-slate-300">
          <span class="font-semibold text-slate-800 dark:text-slate-200">Thesis:</span> {{ item.thesis }}
        </p>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">{{ item.details }}</p>
      </article>
    }
  </div>
</section>
